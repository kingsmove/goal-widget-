name: Build 건안기 APK
on:
  push:
    branches: [ vocab-app ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: gradle assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk GEONANGI-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: geonangi-apk, path: GEONANGI-*.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: voca-${{ github.run_number }}
          name: 건안기 1.${{ github.run_number }}
          make_latest: false
          files: GEONANGI-*.apk
