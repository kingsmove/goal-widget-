name: Build Trip APK

on:
  push:
    branches: [ us-trip ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build release APK
        run: gradle assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk USTRIP-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ustrip-apk
          path: USTRIP-*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trip-${{ github.run_number }}
          name: 미국 여행 1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: USTRIP-*.apk
