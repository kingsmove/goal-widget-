<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>여행</title>
<link rel="stylesheet" href="lib/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="screen"></div>
  <div id="mapScreen">
    <div id="mapEl"></div>
    <div class="mtop">
      <div class="msearch">
        <svg class="i s"><use href="#i-search"/></svg>
        <input id="mq" type="search" placeholder="장소, 식당, 호텔 검색" enterkeyhint="search" autocomplete="off">
        <button id="mqx" style="display:none;color:var(--t3)"><svg class="i s"><use href="#i-x"/></svg></button>
      </div>
      <div class="mres" id="mres" style="display:none"></div>
      <div class="chips" id="mchips"></div>
    </div>
    <div class="mhint" id="mhint">지도를 눌러 위치를 찍어주세요</div>
    <div class="mbtns" id="mbtns">
      <button data-a="map-globe" title="지구본"><svg class="i"><use href="#i-globe"/></svg></button>
      <button data-a="map-fit" title="전체 보기"><svg class="i"><use href="#i-fit"/></svg></button>
      <button data-a="map-me" title="내 위치"><svg class="i"><use href="#i-nav"/></svg></button>
      <button data-a="map-pinmode" id="pinBtn" title="핀 찍기"><svg class="i"><use href="#i-plus"/></svg></button>
    </div>
    <div class="mcard" id="mcard"></div>
  </div>
  <nav id="tabs"></nav>
</div>
<div id="ov"></div>
<div id="viewer">
  <div class="vt">
    <button data-a="v-close"><svg class="i"><use href="#i-x"/></svg></button>
    <div class="m"><b id="vTitle"></b><span id="vSub"></span></div>
    <button data-a="v-edit" id="vEdit"><svg class="i"><use href="#i-edit"/></svg></button>
    <button data-a="v-del"><svg class="i"><use href="#i-trash"/></svg></button>
  </div>
  <div class="stage" id="vStage"><img id="vImg" alt=""></div>
  <div class="cap" id="vCap"></div>
</div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="17" rx="3.5"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9M12 3c-2.5 2.6-3.8 5.6-3.8 9s1.3 6.4 3.8 9"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21.5s-7-6.1-7-11.7a7 7 0 0 1 14 0c0 5.6-7 11.7-7 11.7z"/><circle cx="12" cy="9.8" r="2.6"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="15" rx="3.5"/><path d="M3 10h18M15.5 15h2.5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15.5-4.6-4.6a1.5 1.5 0 0 0-2.1 0L5 20.5"/></symbol>
  <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M4 5.5h16a1 1 0 0 1 1 1v3.2a2.4 2.4 0 0 0 0 4.6v3.2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3.2a2.4 2.4 0 0 0 0-4.6V6.5a1 1 0 0 1 1-1z"/><path d="M14.5 6v2M14.5 11v2M14.5 16v2"/></symbol>
  <symbol id="i-set" viewBox="0 0 24 24"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.5"/><circle cx="9.5" cy="17" r="2.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 14.5 6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="3"/><path d="M5 15V6a3 3 0 0 1 3-3h9"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 12.2A2 2 0 0 0 8.5 21h7a2 2 0 0 0 2-1.8l1-12.2M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
  <symbol id="i-nav" viewBox="0 0 24 24"><path d="M3.5 11 20.5 3.5 13 20.5l-2-7.5z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-food" viewBox="0 0 24 24"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 21V3c-2.2 1.2-3.5 3.6-3.5 7v3H17"/></symbol>
  <symbol id="i-cup" viewBox="0 0 24 24"><path d="M4 8h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6zM17 9.5h1.5a2.5 2.5 0 0 1 0 5H17M8 3v2M12 3v2"/></symbol>
  <symbol id="i-bed" viewBox="0 0 24 24"><path d="M3 19V5M3 15h18v4M21 15v-3a3 3 0 0 0-3-3h-7v6"/><circle cx="7" cy="11" r="2"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12.5H6zM9 8V6.5a3 3 0 0 1 6 0V8"/></symbol>
  <symbol id="i-bus" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="14" rx="3"/><path d="M4 11h16M7.5 17.5V20M16.5 17.5V20"/><circle cx="8" cy="14.3" r=".6"/><circle cx="16" cy="14.3" r=".6"/></symbol>
  <symbol id="i-plane" viewBox="0 0 24 24"><path d="M10.5 13.5 3 11l1.5-1.5 7.5.5 4.5-5c1-1 2.8-1.3 3.3-.8s.2 2.3-.8 3.3l-5 4.5.5 7.5L13 21l-2.5-7.5"/><path d="M6.5 17.5 8 16"/></symbol>
  <symbol id="i-work" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 12.5h18"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></symbol>
  <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 16.5V12l2-5h10l2 5v4.5M3.5 12h17v4.5h-17zM6 16.5V19M18 16.5V19"/></symbol>
  <symbol id="i-tip" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.8 9.2c-.5-.8-1.5-1.3-2.8-1.3-1.6 0-2.8.8-2.8 2s1 1.7 2.8 2.1 2.9.9 2.9 2.1-1.2 2.1-2.9 2.1c-1.3 0-2.4-.5-2.9-1.4M12 6.3v1.6M12 16.1v1.6"/></symbol>
</svg>

<script src="lib/maplibre-gl.js"></script>
<script src="lib/world.js"></script>
<script src="app.js"></script>
</body>
</html>
