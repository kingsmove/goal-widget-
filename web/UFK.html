<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UFK</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#F2F4F6;--card:#FFFFFF;--text:#191F28;--sub:#6B7684;--ter:#B0B8C1;--line:#E5E8EB;--fill:#F2F4F6;
  --blue:#3182F6;--blueSoft:#E8F3FF;--red:#F04452;--green:#03B26C;--shadow:0 1px 2px rgba(0,0,0,.04);
}
html.dark{
  --bg:#17171C;--card:#202027;--text:#F2F2F4;--sub:#9E9EA6;--ter:#5F5F68;--line:#34343C;--fill:#2C2C35;
  --blueSoft:#1C2B42;--red:#F25B67;--green:#26C281;--shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.2px;font-size:15px}
button{font-family:inherit;letter-spacing:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);background:var(--fill);border:1.5px solid transparent;border-radius:12px;padding:11px 13px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:var(--card)}
textarea{resize:vertical;min-height:70px}
.app{display:flex;min-height:100vh}
.side{width:232px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-weight:800;font-size:22px;letter-spacing:-.6px}
.logo svg{width:32px;height:32px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-size:15px;font-weight:600;color:var(--sub);text-align:left}
.nav button:hover{background:var(--fill)}
.nav button.on{background:var(--blueSoft);color:var(--blue)}
.nav .ic{width:20px;text-align:center;font-size:16px}
.side .foot{margin-top:auto;font-size:12px;color:var(--ter);padding:10px}
.main{flex:1;min-width:0;padding:28px 36px 60px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:28px;margin:4px 0 18px;letter-spacing:-.8px}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.card h3{margin:0 0 14px;font-size:17px;letter-spacing:-.4px;display:flex;align-items:center;gap:8px}
.card h3 .act{margin-left:auto}
.muted{color:var(--sub)}.ter{color:var(--ter)}
.small{font-size:13px}.tiny{font-size:12px}
.big{font-size:30px;font-weight:800;letter-spacing:-1px}
.btn{background:var(--blue);color:#fff;font-weight:700;padding:12px 18px;border-radius:14px;font-size:15px}
.btn:hover{filter:brightness(1.05)}
.btn2{background:var(--fill);color:var(--text);font-weight:700;padding:12px 18px;border-radius:14px;font-size:15px}
.btn.danger,.btn2.danger{color:var(--red)}
.btn.danger{background:var(--red);color:#fff}
.chip{background:var(--fill);padding:8px 13px;border-radius:11px;font-size:14px;font-weight:600}
.chip.on{background:var(--blue);color:#fff}
.link{color:var(--blue);font-weight:700;font-size:13px;background:var(--blueSoft);padding:6px 10px;border-radius:10px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--blueSoft);color:var(--blue);white-space:nowrap}
.seg{display:flex;background:var(--line);padding:4px;border-radius:14px;gap:4px}
html.dark .seg{background:var(--card)}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:600;color:var(--sub);font-size:14px}
.seg button.on{background:var(--card);color:var(--text);font-weight:800;box-shadow:var(--shadow)}
html.dark .seg button.on{background:var(--fill)}
.bar{height:8px;background:var(--fill);border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:8px;background:var(--blue);transition:width .4s}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900}
.chk.on{background:var(--blue);border-color:var(--blue)}
.item{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:12px;cursor:pointer}
.item:hover{background:var(--fill)}
.empty{text-align:center;color:var(--ter);padding:18px 0;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;position:relative}
.sw.on{outline:3px solid var(--text);outline-offset:2px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:16px 0 7px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:var(--card);border-radius:24px;padding:26px;width:min(560px,100%);max-height:92vh;overflow:auto}
.modal h2{margin:0 0 6px;font-size:22px;letter-spacing:-.6px}
.modal .acts{display:flex;gap:8px;margin-top:24px}
.modal .acts .btn{flex:2}.modal .acts .btn2{flex:1}
/* ring */
.ring{position:relative;width:96px;height:96px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .dow{text-align:center;font-size:12px;color:var(--sub);font-weight:600;padding:6px 0}
.week{position:relative;display:grid;grid-template-columns:repeat(7,1fr)}
.dcell{min-height:92px;border-top:1px solid var(--line);padding:4px;cursor:pointer;border-radius:10px}
.dcell:hover{background:var(--fill)}
.dcell.sel{background:var(--blueSoft)}
.dnum{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;margin:0 auto}
.dnum.today{background:var(--blue);color:#fff}
.dcell.out .dnum{color:var(--ter)}
.cbar{position:absolute;height:17px;border-radius:5px;font-size:11px;font-weight:700;padding:0 6px;overflow:hidden;white-space:nowrap;line-height:17px;cursor:pointer}
.cdots{display:flex;gap:3px;justify-content:center;margin-top:3px;position:absolute;bottom:6px;left:0;right:0}
/* gantt */
.gantt{display:flex;border-radius:18px;overflow:hidden;background:var(--card);user-select:none}
.gnames{width:210px;flex-shrink:0;border-right:1px solid var(--line)}
.gscroll{flex:1;overflow-x:auto;position:relative}
.ghead{height:58px;border-bottom:1px solid var(--line);position:relative}
.grow-h{height:54px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--fill);cursor:pointer}
.grow-h:hover{background:var(--fill)}
.gbar{position:absolute;height:26px;border-radius:7px;overflow:hidden;cursor:grab;display:flex;align-items:center}
.gbar .fillp{position:absolute;left:0;top:0;bottom:0}
.gbar .lbl{position:relative;font-size:12px;font-weight:800;padding:0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.gbar .hdl{position:absolute;right:0;top:0;bottom:0;width:12px;cursor:ew-resize;display:grid;place-items:center}
.gbar .hdl:after{content:"";width:3px;height:12px;border-radius:2px;background:rgba(255,255,255,.85)}
/* planner timetable */
.tt{display:grid;grid-template-columns:30px repeat(6,1fr);gap:2px}
.tt .h{font-size:11px;color:var(--sub);text-align:center;line-height:20px}
.tt .c{height:20px;border-radius:3px;background:var(--fill)}
.timer{font-size:52px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;text-align:center;margin:14px 0 4px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#191F28;color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;z-index:60;font-size:14px}
@media (max-width:900px){.side{display:none}.main{padding:18px}.g2,.g3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#FBF7FA"/><path d="M6 58 C16 46 26 40 34 40 C44 40 52 48 62 52 L62 58 Z" fill="#E11D2E"/><path d="M14 58 C24 38 34 30 40 30 C48 30 54 40 62 46 L62 58Z" fill="#F7535F" opacity=".8"/><path d="M26 58 C34 30 40 22 46 22 C52 22 56 34 62 44 L62 58Z" fill="#FF9AA1" opacity=".7"/><path d="M46 6 C46.8 11 49 13 54 14 C49 15 46.8 17 46 22 C45.2 17 43 15 38 14 C43 13 45.2 11 46 6Z" fill="#E11D2E"/></svg>
      UFK
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="savedAt"></div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<div id="modalRoot"></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">
<script>
"use strict";
// ============================================================ data (same format as the phone app's backup)
const KEY = "ufk-data";
const LEVELS = {YEAR:["연간",0],MONTH:["월간",1],PLAN:["계획",2],WEEK:["주간",3],DAY:["일간",4]};
const LEVEL_ORDER = ["YEAR","MONTH","PLAN","WEEK","DAY"];
const LEVEL_ENUM = ["YEAR","MONTH","WEEK","DAY","PLAN"]; // enum ordinal (theme level colors)
const KINDS = [["일반","",0xFF8B95A1],["근무·인턴","경력",0xFFA882FF],["학업","학력·학업",0xFFE0AC00],["자격증","자격증",0xFF08B94E],["어학","어학",0xFF00BFBC],["대외활동","대외활동",0xFFEC7500],["공모전·프로젝트","공모전·프로젝트",0xFFD4537E],["마일스톤","",0xFF5F5E5A]];
const DEF_ITEMS = ["#3182F6","#00A6A6","#8B5CF6","#FF8A3D","#03B26C","#F25C8A","#F04452","#FFC342","#1B64DA","#7AC74F","#A0704C","#6B7684"];
const DEF_YEARS = ["#3182F6","#00A6A6","#03B26C","#8B5CF6","#FF8A3D"];
let D;

function blank(){return {v:1,focusGuard:true,goals:[],sessions:[],events:[],timer:{goalId:null,running:false,sub:null,acc:0,startedAt:0,sessionStart:0},theme:{mode:0},routines:[],routineSkips:[],notif:{},subjects:[],quotes:[],dayNotes:{}}}
function normalize(d){
  const b = blank();
  for (const k of Object.keys(b)) if (d[k] === undefined || d[k] === null) d[k] = b[k];
  d.timer = Object.assign(b.timer, d.timer);
  return d;
}
function load(){
  try { const s = localStorage.getItem(KEY); D = s ? normalize(JSON.parse(s)) : blank(); }
  catch(e){ D = blank(); }
}
let saveTimer = null;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(D)); document.getElementById("savedAt").textContent = "자동 저장됨 · " + hm(Date.now()); }
  catch(e){ toast("저장하지 못했어요 (브라우저 저장소)"); }
}
function commit(){ save(); render(); }
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now());

// ============================================================ dates (epochDay = days since 1970-01-01, local calendar)
const DOW = ["일","월","화","수","목","금","토"];
function today(){ const n = new Date(); return Math.round(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / 864e5); }
function ed2d(e){ return new Date(e * 864e5); } // read with UTC getters
function ymd(e){ const d = ed2d(e); return [d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()]; }
function mkDay(y, m, d){ return Math.round(Date.UTC(y, m - 1, d) / 864e5); }
function dow(e){ return ed2d(e).getUTCDay(); }
function full(e){ const [y,m,d] = ymd(e); return `${m}월 ${d}일 (${DOW[dow(e)]})`; }
function md(e){ const [y,m,d] = ymd(e); return `${m}/${d}`; }
function span(a,b){ const A = ymd(a), B = ymd(b); return A[0] !== B[0] ? `${A[0]}.${A[1]}.${A[2]} ~ ${B[0]}.${B[1]}.${B[2]}` : `${md(a)} ~ ${md(b)}`; }
function rel(e){ const x = e - today(); return x === 0 ? "오늘" : x === 1 ? "내일" : x === -1 ? "어제" : full(e); }
function dday(e){ const x = e - today(); return x === 0 ? "D-Day" : x > 0 ? "D-" + x : "D+" + (-x); }
function iso(e){ const [y,m,d] = ymd(e); return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
function fromIso(s){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? mkDay(+m[1], +m[2], +m[3]) : null; }
function dayOfMs(ms){ const d = new Date(ms); return mkDay(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
function dayStartMs(e){ const [y,m,d] = ymd(e); return new Date(y, m - 1, d).getTime(); }
function hm(ms){ const d = new Date(ms); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function minuteLabel(m){ if (m < 0) return "하루 종일"; const h = Math.floor(m / 60), mm = m % 60, ap = h < 12 ? "오전" : "오후", h12 = h % 12 === 0 ? 12 : h % 12; return mm ? `${ap} ${h12}:${String(mm).padStart(2,"0")}` : `${ap} ${h12}시`; }
function dur(ms){ const t = Math.floor(ms / 60000), h = Math.floor(t / 60), m = t % 60; return h && m ? `${h}시간 ${m}분` : h ? `${h}시간` : `${m}분`; }
function clock(ms){ const s = Math.floor(ms / 1000); return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(x => String(x).padStart(2,"0")).join(":"); }
function lastOfMonth(y, m){ return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function periodLabel(g){
  const [ey, em] = ymd(g.end);
  switch (g.level){
    case "YEAR": return `${ey}년`;
    case "MONTH": return `${em}월까지`;
    case "WEEK": return span(g.start, g.end);
    case "DAY": return full(g.end);
    default: return g.start === g.end ? full(g.end) + "까지" : span(g.start, g.end);
  }
}
function defaultRange(level, base){
  const [y, m] = ymd(base);
  if (level === "YEAR") return [base, mkDay(y, 12, 31)];
  if (level === "MONTH") return [base, mkDay(y, m, lastOfMonth(y, m))];
  if (level === "WEEK"){ const mon = base - ((dow(base) + 6) % 7); return [mon, mon + 6]; }
  if (level === "DAY") return [base, base];
  return [base, base + 29];
}

// ============================================================ colors
const toHex = n => "#" + ((n >>> 0) & 0xFFFFFF).toString(16).padStart(6, "0").toUpperCase();
const toInt = hex => (0xFF000000 | parseInt(hex.replace("#",""), 16)) | 0;
function itemColors(){ const o = (D.theme && D.theme.items) || []; return DEF_ITEMS.map((c,i) => o[i] != null ? toHex(o[i]) : c); }
function yearColors(){ const o = (D.theme && D.theme.years) || []; return DEF_YEARS.map((c,i) => o[i] != null ? toHex(o[i]) : c); }
function accent(){ return D.theme && D.theme.accent != null ? toHex(D.theme.accent) : "#3182F6"; }
function levelColor(level){ const o = (D.theme && D.theme.levels) || []; const i = LEVEL_ENUM.indexOf(level); return o[i] != null ? toHex(o[i]) : accent(); }
function goalColor(g){ if (g.cc != null) return toHex(g.cc); if (g.color >= 0) { const p = itemColors(); return p[g.color % p.length]; } return levelColor(g.level); }
function eventColor(e){ if (e.cc != null) return toHex(e.cc); const p = itemColors(); return p[((e.color || 0) % p.length + p.length) % p.length]; }
function alpha(hex, a){ const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

// ============================================================ calc (same rules as the app)
const goalById = id => D.goals.find(g => g.id === id);
const children = id => D.goals.filter(g => g.parentId === id).sort((a,b) => a.end - b.end || a.createdAt - b.createdAt);
function descendants(id){ const out = new Set(), q = [id]; while (q.length){ const c = q.shift(); D.goals.forEach(g => { if (g.parentId === c && !out.has(g.id)) { out.add(g.id); q.push(g.id); } }); } return out; }
function progress(g, depth = 0){
  if (g.done) return 1;
  if (g.target > 0) return Math.min(1, Math.max(0, (g.current || 0) / g.target));
  if (depth > 8) return 0;
  const k = D.goals.filter(x => x.parentId === g.id);
  if (!k.length) return 0;
  return k.reduce((s, x) => s + progress(x, depth + 1), 0) / k.length;
}
const pct = p => Math.round(Math.min(1, Math.max(0, p)) * 100);
const dayGoals = day => D.goals.filter(g => g.level === "DAY" && g.end === day).sort((a,b) => (a.done - b.done) || a.createdAt - b.createdAt);
const activeGoals = () => D.goals.filter(g => g.level !== "DAY" && !g.done && g.end >= today()).sort((a,b) => LEVELS[a.level][1] - LEVELS[b.level][1] || a.end - b.end);
const eventsOn = day => D.events.filter(e => e.day <= day && day <= (e.endDay ?? e.day)).sort((a,b) => (a.endDay > a.day ? 0 : 1) - (b.endDay > b.day ? 0 : 1) || a.minute - b.minute);
const upcoming = () => D.events.filter(e => (e.endDay ?? e.day) >= today()).sort((a,b) => a.day - b.day || a.minute - b.minute);
function timerElapsed(now = Date.now()){ const t = D.timer; return (t.acc || 0) + (t.running ? Math.max(0, now - t.startedAt) : 0); }
const timerActive = () => D.timer.running || (D.timer.acc || 0) > 0;
function sessionsOn(day){
  const list = D.sessions.filter(s => dayOfMs(s.start) === day).slice();
  if (timerActive() && day === today()){ const n = Date.now(); list.push({id:"running", goalId:D.timer.goalId, start:D.timer.sessionStart || n - timerElapsed(n), dur:timerElapsed(n), sub:D.timer.sub}); }
  return list.sort((a,b) => a.start - b.start);
}
const studyOn = day => sessionsOn(day).reduce((s, x) => s + x.dur, 0);
function ensureRoutines(){
  const t = today(), w = (dow(t) + 6) % 7; let changed = false;
  (D.routines || []).forEach(r => {
    if (!(r.days & (1 << w))) return;
    const id = `rt-${r.id}-${t}`;
    if ((D.routineSkips || []).includes(id) || D.goals.some(g => g.id === id)) return;
    D.goals.push({id, title:r.title, level:"DAY", parentId:r.parentId ?? null, start:t, end:t, done:false, memo:r.memo || "", createdAt:Date.now(), color:-1, cc:null, target:0, current:0, unit:"", src:""});
    changed = true;
  });
  if (changed) save();
}
function subjectOf(s){ return D.subjects.find(x => x.id === s.sub); }
function sessionColor(s){ const sb = subjectOf(s); if (sb) return toHex(sb.color); const g = goalById(s.goalId); return g ? goalColor(g) : accent(); }
function sessionLabel(s){ const sb = subjectOf(s); if (sb) return sb.name; const g = goalById(s.goalId); return g ? g.title : "기타"; }

// ============================================================ ui helpers
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function ring(p, size = 96, sw = 10){
  const r = (size - sw) / 2, c = 2 * Math.PI * r;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--fill)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--blue)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}"/></svg><b>${pct(p)}%</b></div>`;
}
const bar = (p, color = "var(--blue)", h = 8) => `<div class="bar" style="height:${h}px"><i style="width:${pct(p)}%;background:${color}"></i></div>`;
function applyTheme(){
  const m = D.theme.mode || 0;
  const dark = m === 2 || (m === 0 && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark", dark);
  document.documentElement.style.setProperty("--blue", accent());
  document.documentElement.style.setProperty("--blueSoft", alpha(accent(), dark ? .2 : .11));
}

// ============================================================ navigation
const VIEWS = [["home","홈","⌂"],["goals","목표","⚑"],["gantt","공정표","▤"],["calendar","캘린더","▦"],["planner","플래너","◷"],["quotes","좋은 말","❝"],["resume","이력서","☰"],["settings","설정","⚙"]];
let view = location.hash.slice(1) || "home";
if (!VIEWS.some(v => v[0] === view)) view = "home";
function go(v){ view = v; location.hash = v; render(); window.scrollTo(0, 0); }
function renderNav(){
  $("#nav").innerHTML = VIEWS.map(([k,l,i]) => `<button class="${k === view ? "on" : ""}" onclick="go('${k}')"><span class="ic">${i}</span>${l}</button>`).join("");
}
function render(){
  applyTheme(); renderNav();
  const v = {home:vHome, goals:vGoals, gantt:vGantt, calendar:vCalendar, planner:vPlanner, quotes:vQuotes, resume:vResume, settings:vSettings}[view];
  $("#view").innerHTML = v();
  if (view === "gantt") mountGantt();
}

// ============================================================ HOME
function goalRow(g, showParent = true){
  const p = goalById(g.parentId);
  return `<div class="item" onclick="openGoal('${g.id}')">
    <div class="chk ${g.done ? "on" : ""}" onclick="event.stopPropagation();toggleGoal('${g.id}')">${g.done ? "✓" : ""}</div>
    <div class="grow"><div style="font-weight:600;${g.done ? "color:var(--ter)" : ""}">${esc(g.title)}</div>${showParent && p ? `<div class="small muted">${esc(p.title)}</div>` : ""}</div>
    ${g.target > 0 ? `<span class="small muted">${g.current}/${g.target}${esc(g.unit)}</span>` : ""}
  </div>`;
}
function progressRow(g){
  const p = progress(g), c = goalColor(g);
  return `<div style="padding:10px 4px;cursor:pointer" onclick="openGoal('${g.id}')">
    <div class="row"><span class="pill" style="background:var(--fill);color:var(--sub)">${LEVELS[g.level][0]}</span><b class="grow" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(g.title)}</b><span class="small muted">${dday(g.end)}</span></div>
    <div class="row" style="margin-top:9px"><div class="grow">${bar(p, c)}</div><b class="small" style="color:${c};width:40px;text-align:right">${pct(p)}%</b></div></div>`;
}
function eventRow(e){
  const c = eventColor(e), [y,m,d] = ymd(e.day), ranged = (e.endDay ?? e.day) > e.day;
  return `<div class="item" onclick="editEvent('${e.id}')">
    <div style="width:46px;height:46px;border-radius:14px;background:${alpha(c,.12)};color:${c};display:grid;place-items:center;text-align:center;line-height:1.1"><div><div class="tiny">${m}월</div><b>${d}</b></div></div>
    <div class="grow"><b>${esc(e.title)}</b><div class="small muted">${ranged ? span(e.day, e.endDay) : rel(e.day) + " · " + minuteLabel(e.minute)}</div></div></div>`;
}
function quoteOfDay(){ if (!D.quotes.length) return null; const q = D.quotes.slice().sort((a,b) => a.createdAt - b.createdAt); return q[((today() % q.length) + q.length) % q.length]; }
function vHome(){
  const t = today(), todos = dayGoals(t), prog = todos.length ? todos.reduce((s,g) => s + progress(g), 0) / todos.length : 0;
  const overdue = D.goals.filter(g => g.level === "DAY" && !g.done && g.end < t && g.end >= t - 14 && !g.id.startsWith("rt-"));
  const q = quoteOfDay();
  return `<div class="muted" style="font-weight:600">${full(t)}</div><h1>${todos.length ? (prog >= 1 ? "오늘 목표 완료!" : prog >= .5 ? "절반 넘게 왔어요" : "오늘도 한 걸음씩") : "오늘 할 일을 정해볼까요?"}</h1>
  <div class="grid g3">
    <div class="card"><div class="row" style="gap:20px">${ring(prog)}<div><div class="small muted">오늘 달성률</div><div style="font-size:20px;font-weight:800;margin:3px 0">할 일 ${todos.filter(g => g.done).length} / ${todos.length}</div><div class="small muted">공부 <b style="color:var(--blue)">${dur(studyOn(t))}</b> ${D.timer.running ? '<span class="pill">측정 중</span>' : ""}</div></div></div></div>
    <div class="card" style="grid-column:span 2;cursor:pointer" onclick="go('quotes')"><div class="row"><span class="small muted grow" style="font-weight:600">들었던 좋은 말</span><span class="link">${q ? D.quotes.length + "개 →" : "+ 적기"}</span></div>
      ${q ? `<div style="font-size:19px;font-weight:700;margin-top:10px;line-height:1.5">“${esc(q.text)}”</div>${q.who ? `<div class="muted small" style="margin-top:6px">— ${esc(q.who)}</div>` : ""}` : `<div class="ter" style="margin-top:10px;font-weight:600">누군가에게 들은 힘이 되는 말을 모아두세요</div>`}</div>
  </div>
  <div class="grid g3" style="margin-top:14px;align-items:start">
    <div class="card"><h3>오늘 할 일 <button class="link act" onclick="newGoal('DAY')">+ 추가</button></h3>
      ${overdue.length ? `<div class="row" style="background:var(--fill);border-radius:12px;padding:10px 12px;margin-bottom:8px"><span class="small muted grow">지난 미완료 ${overdue.length}개</span><button class="link" onclick="carryOver()">오늘로 가져오기</button></div>` : ""}
      ${todos.length ? todos.map(g => goalRow(g)).join("") : '<div class="empty">오늘 할 일을 추가해보세요</div>'}</div>
    <div class="card"><h3>진행 중인 목표 <button class="link act" onclick="newGoal('PLAN')">+ 추가</button></h3>${activeGoals().slice(0,7).map(progressRow).join("") || '<div class="empty">계획이나 월간 목표를 세워보세요</div>'}</div>
    <div class="card"><h3>다가오는 일정 <button class="link act" onclick="editEvent(null)">+ 추가</button></h3>${upcoming().slice(0,5).map(eventRow).join("") || '<div class="empty">예정된 일정이 없어요</div>'}</div>
  </div>`;
}
function carryOver(){ const t = today(); D.goals.forEach(g => { if (g.level === "DAY" && !g.done && g.end < t && g.end >= t - 14 && !g.id.startsWith("rt-")) { g.start = t; g.end = t; } }); commit(); }
function toggleGoal(id){ const g = goalById(id); if (!g) return; g.done = !g.done; commit(); }

// ============================================================ GOALS
let goalTab = "PLAN";
function vGoals(){
  const t = today(), all = D.goals.filter(g => g.level === goalTab);
  const cur = all.filter(g => g.end >= t).sort((a,b) => (a.done - b.done) || a.end - b.end);
  const past = all.filter(g => g.end < t).sort((a,b) => b.end - a.end);
  const hints = {YEAR:"올해 이루고 싶은 큰 목표", MONTH:"몇 월까지 끝낼지 정하는 목표", PLAN:"특정 날까지 끝낼 일 · 시작일과 마감일을 직접 정해요", WEEK:"이번 주에 끝낼 단위", DAY:"오늘은 어디까지 할지"};
  return `<div class="row"><h1 class="grow">목표</h1><button class="btn" onclick="newGoal(goalTab)">+ ${LEVELS[goalTab][0]} 목표</button></div>
  <div class="seg" style="max-width:560px">${LEVEL_ORDER.map(l => `<button class="${l === goalTab ? "on" : ""}" onclick="goalTab='${l}';render()">${LEVELS[l][0]}</button>`).join("")}</div>
  <p class="small muted">${hints[goalTab]}</p>
  ${goalTab === "DAY" ? routineCard() : ""}
  <div class="grid g2" style="margin-top:12px">${cur.map(goalCard).join("") || '<div class="card"><div class="empty">아직 없어요 · 오른쪽 위 버튼으로 추가해보세요</div></div>'}</div>
  ${past.length ? `<h3 style="margin:28px 0 12px" class="muted">지난 목표 ${past.length}개</h3><div class="grid g2">${past.map(goalCard).join("")}</div>` : ""}`;
}
function goalCard(g){
  const p = progress(g), c = goalColor(g), kids = children(g.id), par = goalById(g.parentId);
  const studyMs = D.sessions.filter(s => s.goalId === g.id || descendants(g.id).has(s.goalId)).reduce((s,x) => s + x.dur, 0);
  return `<div class="card" style="cursor:pointer" onclick="openGoal('${g.id}')">
    <div class="row">${g.level === "DAY" ? `<div class="chk ${g.done ? "on" : ""}" onclick="event.stopPropagation();toggleGoal('${g.id}')">${g.done ? "✓" : ""}</div>` : ""}
      <div class="grow"><b style="font-size:17px;${g.done ? "color:var(--ter)" : ""}">${esc(g.title)}</b><div class="small muted" style="margin-top:3px">${periodLabel(g)}${par ? " · " + esc(par.title) : ""}</div></div>
      ${g.done ? '<span class="pill" style="background:var(--fill);color:var(--green)">완료</span>' : `<span class="pill" style="background:${alpha(c,.12)};color:${c}">${dday(g.end)}</span>`}</div>
    ${g.level !== "DAY" || kids.length || g.target > 0 ? `<div class="row" style="margin-top:16px"><div class="grow">${bar(p, c)}</div><b style="color:${c};width:44px;text-align:right">${pct(p)}%</b></div>` : ""}
    <div class="row small muted" style="margin-top:10px">
      <span class="grow">${[g.target > 0 ? `${g.current}/${g.target}${esc(g.unit)}` : "", kids.length ? `세부 ${kids.filter(k => progress(k) >= 1).length}/${kids.length}` : "", studyMs ? "공부 " + dur(studyMs) : ""].filter(Boolean).join(" · ")}</span>
      ${g.target > 0 && !g.done ? `<button class="link" style="color:${c};background:${alpha(c,.12)}" onclick="event.stopPropagation();bump('${g.id}',1)">+1${esc(g.unit)}</button>` : ""}</div></div>`;
}
function bump(id, n){ const g = goalById(id); g.current = Math.max(0, (g.current || 0) + n); if (g.target > 0) g.done = g.current >= g.target; commit(); }
function daysLabel(d){ return d === 127 ? "매일" : d === 31 ? "평일" : d === 96 ? "주말" : "월화수목금토일".split("").filter((_,i) => d & (1 << i)).join("·"); }
function routineCard(){
  return `<div class="card" style="margin-top:12px"><h3>반복 할 일 <button class="link act" onclick="editRoutine(null)">+ 추가</button></h3>
  ${(D.routines || []).map(r => `<div class="item" onclick="editRoutine('${r.id}')"><div class="grow"><b>${esc(r.title)}</b><div class="small muted">${daysLabel(r.days)}${goalById(r.parentId) ? " · " + esc(goalById(r.parentId).title) : ""}</div></div><span class="pill">↻ ${daysLabel(r.days)}</span></div>`).join("") || '<div class="small muted">매일·특정 요일마다 자동으로 오늘 할 일에 들어가요</div>'}</div>`;
}

// goal detail
function openGoal(id){
  const g = goalById(id); if (!g) return;
  const p = progress(g), c = goalColor(g), kids = children(g.id), par = goalById(g.parentId);
  const child = {YEAR:"MONTH", MONTH:"WEEK", PLAN:"DAY", WEEK:"DAY"}[g.level];
  modal(`<div class="row"><span class="pill" style="background:${alpha(c,.12)};color:${c}">${LEVELS[g.level][0]} 목표</span><span class="small muted">${periodLabel(g)} · ${dday(g.end)}</span></div>
    <h2 style="margin-top:12px">${esc(g.title)}</h2>${par ? `<div class="small" style="color:var(--blue);cursor:pointer;font-weight:700" onclick="openGoal('${par.id}')">↑ ${esc(par.title)}</div>` : ""}
    ${g.memo ? `<p class="muted">${esc(g.memo)}</p>` : ""}
    <div class="row" style="margin-top:16px;align-items:flex-end"><span style="font-size:44px;font-weight:800;color:${c}">${pct(p)}<span style="font-size:22px">%</span></span></div>${bar(p, c, 10)}
    ${g.target > 0 ? `<div class="row" style="margin-top:14px"><b class="grow" style="font-size:20px">${g.current} / ${g.target}${esc(g.unit)}</b><button class="btn2" onclick="bump('${g.id}',-1);openGoal('${g.id}')">−</button><button class="btn" style="background:${c}" onclick="bump('${g.id}',1);openGoal('${g.id}')">+1</button></div>` : ""}
    <div class="row" style="margin-top:16px"><button class="btn2 grow" onclick="toggleGoal('${g.id}');openGoal('${g.id}')">${g.done ? "완료 취소" : "완료로 표시"}</button><button class="btn grow" style="background:${c}" onclick="closeModal();timerFor('${g.id}')">타이머 시작</button></div>
    ${child ? `<h3 style="margin:22px 0 6px;display:flex">세부 목표<button class="link" style="margin-left:auto" onclick="newGoal('${child}','${g.id}')">+ 추가</button></h3>${kids.map(k => goalRow(k, false)).join("") || '<div class="small muted">세부 목표로 나눠보세요</div>'}` : ""}
    <div class="acts"><button class="btn2 danger" onclick="delGoal('${g.id}')">삭제</button><button class="btn" onclick="editGoal('${g.id}')">수정</button></div>`);
}
function delGoal(id){
  if (!confirm("목표를 삭제할까요? 세부 목표도 함께 삭제돼요.")) return;
  const rm = descendants(id); rm.add(id);
  D.goals = D.goals.filter(g => !rm.has(g.id));
  D.routineSkips = (D.routineSkips || []).concat([...rm].filter(x => x.startsWith("rt-")));
  if (rm.has(D.timer.goalId)) D.timer.goalId = null;
  closeModal(); commit();
}
function newGoal(level, parentId){ editGoal(null, level, parentId); }
function swatchRow(name, selIdx, custom, allowDefault){
  const p = itemColors();
  return `<div class="swatches" data-name="${name}">${allowDefault ? `<button type="button" class="chip ${selIdx < 0 && custom == null ? "on" : ""}" data-idx="-1">기본</button>` : ""}
    ${p.map((c,i) => `<button type="button" class="sw ${i === selIdx && custom == null ? "on" : ""}" style="background:${c}" data-idx="${i}"></button>`).join("")}
    <label class="sw ${custom != null ? "on" : ""}" style="background:${custom != null ? toHex(custom) : "conic-gradient(red,yellow,lime,cyan,blue,magenta,red)"};cursor:pointer" title="직접 고르기"><input type="color" value="${custom != null ? toHex(custom) : "#3182F6"}" style="opacity:0;width:0;height:0;padding:0;border:0" data-custom="1"></label></div>`;
}
function bindSwatches(root, state){
  root.querySelectorAll(".swatches").forEach(box => {
    box.addEventListener("click", e => {
      const b = e.target.closest("[data-idx]"); if (!b) return;
      state.idx = +b.dataset.idx; state.cc = null;
      box.querySelectorAll(".on").forEach(x => x.classList.remove("on")); b.classList.add("on");
    });
    const ci = box.querySelector("[data-custom]");
    ci.addEventListener("input", () => { state.cc = toInt(ci.value); box.querySelectorAll(".on").forEach(x => x.classList.remove("on")); ci.parentElement.classList.add("on"); ci.parentElement.style.background = ci.value; });
  });
}
function editGoal(id, level, parentId){
  const g = id ? goalById(id) : null;
  const t = today();
  const lv = g ? g.level : (level || "PLAN");
  const [s0, e0] = g ? [g.start, g.end] : defaultRange(lv, t);
  const pid = g ? g.parentId : (parentId || null);
  const par = goalById(pid);
  const allowed = LEVEL_ORDER.filter(l => !par || LEVELS[l][1] > LEVELS[par.level][1]);
  const parents = D.goals.filter(x => x.level !== "DAY" && x.id !== id && !x.done);
  const st = {idx: g ? (g.color ?? -1) : -1, cc: g ? g.cc ?? null : null};
  modal(`<h2>${g ? "목표 수정" : "새 목표"}</h2>
    <label class="f">종류</label><div class="seg" id="lvSeg">${allowed.map(l => `<button type="button" class="${l === lv ? "on" : ""}" data-l="${l}">${LEVELS[l][0]}</button>`).join("")}</div>
    <label class="f">목표</label><input id="gTitle" value="${esc(g ? g.title : "")}" placeholder="예: 포트폴리오 완성">
    <div class="grid g2"><div><label class="f">시작일</label><input type="date" id="gStart" value="${iso(s0)}"></div><div><label class="f">마감일</label><input type="date" id="gEnd" value="${iso(e0)}"></div></div>
    <label class="f">상위 목표</label><select id="gParent"><option value="">없음</option>${parents.map(x => `<option value="${x.id}" ${x.id === pid ? "selected" : ""}>[${LEVELS[x.level][0]}] ${esc(x.title)}</option>`).join("")}</select>
    <label class="f">색상</label>${swatchRow("g", st.idx, st.cc, true)}
    <div class="grid g2"><div><label class="f">숫자 목표 (선택)</label><input id="gTarget" type="number" min="0" value="${g && g.target ? g.target : ""}" placeholder="예: 10"></div><div><label class="f">단위</label><input id="gUnit" value="${esc(g ? g.unit || "" : "회")}"></div></div>
    <label class="f">메모</label><textarea id="gMemo">${esc(g ? g.memo : "")}</textarea>
    <div class="acts"><button class="btn2" onclick="closeModal()">취소</button><button class="btn" id="gSave">${g ? "저장하기" : "추가하기"}</button></div>`);
  let curLv = lv;
  const root = $("#modalRoot");
  bindSwatches(root, st);
  root.querySelector("#lvSeg").addEventListener("click", e => {
    const b = e.target.closest("[data-l]"); if (!b) return;
    curLv = b.dataset.l; root.querySelectorAll("#lvSeg button").forEach(x => x.classList.toggle("on", x === b));
    if (!g){ const [a, z] = defaultRange(curLv, t); $("#gStart").value = iso(a); $("#gEnd").value = iso(z); }
  });
  $("#gTitle").focus();
  $("#gSave").onclick = () => {
    const title = $("#gTitle").value.trim(); if (!title) return toast("목표를 적어주세요");
    let s = fromIso($("#gStart").value) ?? t, e = fromIso($("#gEnd").value) ?? s; if (e < s) e = s;
    if (curLv === "DAY") s = e;
    const target = parseInt($("#gTarget").value) || 0;
    const obj = Object.assign(g || {id:uid(), done:false, createdAt:Date.now(), current:0, src:""}, {
      title, level:curLv, parentId:$("#gParent").value || null, start:s, end:e, memo:$("#gMemo").value.trim(),
      color:st.idx, cc:st.cc, target, unit:target ? $("#gUnit").value.trim() : "",
    });
    if (!g) D.goals.push(obj);
    closeModal(); commit();
  };
}

// routines
function editRoutine(id){
  const r = id ? D.routines.find(x => x.id === id) : null;
  let days = r ? r.days : 127;
  const parents = D.goals.filter(x => x.level !== "DAY" && !x.done);
  modal(`<h2>${r ? "반복 할 일 수정" : "반복 할 일"}</h2>
    <label class="f">할 일</label><input id="rTitle" value="${esc(r ? r.title : "")}" placeholder="예: 영단어 30개">
    <label class="f">요일</label><div class="swatches" id="rDays">${"월화수목금토일".split("").map((d,i) => `<button type="button" class="chip ${days & (1 << i) ? "on" : ""}" data-b="${i}">${d}</button>`).join("")}</div>
    <label class="f">상위 목표</label><select id="rParent"><option value="">없음</option>${parents.map(x => `<option value="${x.id}" ${r && x.id === r.parentId ? "selected" : ""}>${esc(x.title)}</option>`).join("")}</select>
    <label class="f">메모</label><input id="rMemo" value="${esc(r ? r.memo : "")}">
    <div class="acts">${r ? `<button class="btn2 danger" id="rDel">그만하기</button>` : `<button class="btn2" onclick="closeModal()">취소</button>`}<button class="btn" id="rSave">저장</button></div>`);
  $("#rDays").onclick = e => { const b = e.target.closest("[data-b]"); if (!b) return; days ^= 1 << +b.dataset.b; b.classList.toggle("on"); };
  $("#rSave").onclick = () => {
    const title = $("#rTitle").value.trim(); if (!title || !days) return toast("할 일과 요일을 정해주세요");
    const obj = Object.assign(r || {id:uid(), createdAt:Date.now(), src:""}, {title, days, parentId:$("#rParent").value || null, memo:$("#rMemo").value.trim()});
    if (!r) D.routines.push(obj);
    ensureRoutines(); closeModal(); commit();
  };
  if (r) $("#rDel").onclick = () => { D.routines = D.routines.filter(x => x.id !== r.id); const gid = `rt-${r.id}-${today()}`; D.goals = D.goals.filter(g => !(g.id === gid && !g.done)); closeModal(); commit(); };
}

// ============================================================ EVENTS
function editEvent(id, presetDay, presetPlan){
  const e = id ? D.events.find(x => x.id === id) : null;
  const t = presetDay ?? today();
  const st = {idx: e ? e.color || 0 : 0, cc: e ? e.cc ?? null : null};
  modal(`<h2>${e ? "일정 수정" : "새 일정"}</h2>
    <label class="f">무슨 일정인가요?</label><input id="eTitle" value="${esc(e ? e.title : "")}" placeholder="예: 졸업설계, 인턴, 여행, 약속">
    <label class="f">종류 · 일반이 아니면 이력서에 들어가요</label><select id="eKind">${KINDS.map((k,i) => `<option value="${i}" ${(e ? e.type || 0 : 0) === i ? "selected" : ""}>${k[0]}</option>`).join("")}</select>

// ============================================================ GANTT
const G = {monthW:90, week:false, long:false, events:true, done:true};
function ganttRows(){
  const t = today(), lv = new Set(["PLAN"]); if (G.long){ lv.add("YEAR"); lv.add("MONTH"); } if (G.week) lv.add("WEEK");
  const shown = D.goals.filter(g => lv.has(g.level) && (G.done || !g.done)), ids = new Set(shown.map(g => g.id)), rows = [];
  const add = (g, depth) => { rows.push({kind:"g", ref:g, title:g.title, label:LEVELS[g.level][0], start:g.start, end:g.end, depth, color:goalColor(g), p:progress(g), done:g.done});
    shown.filter(x => x.parentId === g.id).sort((a,b) => a.start - b.start || a.end - b.end).forEach(x => depth < 4 && add(x, depth + 1)); };
  shown.filter(g => !g.parentId || !ids.has(g.parentId)).sort((a,b) => LEVELS[a.level][1] - LEVELS[b.level][1] || a.start - b.start || a.end - b.end).forEach(g => add(g, 0));
  if (G.events) D.events.filter(e => e.plan && (G.done || (e.endDay ?? e.day) >= t)).sort((a,b) => a.day - b.day || a.endDay - b.endDay)
    .forEach(e => rows.push({kind:"e", ref:e, title:e.title, label:e.type ? KINDS[e.type][0] : "일정", start:e.day, end:e.endDay ?? e.day, depth:0, color:eventColor(e), p:null, done:(e.endDay ?? e.day) < t}));

}
function vGantt(){

  <div class="row" style="flex-wrap:wrap;margin-bottom:12px">
    ${[["events","플랜 일정"],["long","연간·월간"],["week","주간 목표"],["done","지난·완료"]].map(([k,l]) => `<button class="chip ${G[k] ? "on" : ""}" onclick="G.${k}=!G.${k};render()">${l}</button>`).join("")}
    <span class="grow"></span><span class="small muted">막대 클릭: 수정 · 끌기: 기간 이동 · 오른쪽 끝 끌기: 끝나는 날 변경</span>
    <button class="chip" onclick="G.monthW=Math.max(40,G.monthW-20);render()">−</button><button class="chip" onclick="G.monthW=Math.min(220,G.monthW+20);render()">+</button></div>

function mountGantt(){
  const rows = ganttRows(), t = today(), [ty, tm] = ymd(t);
  const minD = Math.min(t, ...rows.map(r => r.start)), maxD = Math.max(t, ...rows.map(r => r.end));
  let [fy, fm] = ymd(minD); fm -= 1; if (fm < 1){ fm = 12; fy--; }
  let [ly, lm] = ymd(maxD); lm += 1; if (lm > 12){ lm = 1; ly++; }
  let months = (ly - fy) * 12 + (lm - fm) + 1; if (months < 12) months = 12; months = Math.min(months, 120);
  const mw = G.monthW, RH = 54;
  const pos = day => { const [y,m,d] = ymd(day); return ((y - fy) * 12 + (m - fm) + (d - 1) / lastOfMonth(y, m)) * mw; };
  const W = months * mw, H = Math.max(rows.length, 1) * RH;
  let head = "", grid = "";
  for (let i = 0; i < months; ){
    const y = fy + Math.floor((fm - 1 + i) / 12), m = (fm - 1 + i) % 12 + 1, n = Math.min(12 - m + 1, months - i), c = yearColors()[((y % 5) + 5) % 5];
    head += `<div style="position:absolute;left:${i * mw}px;width:${n * mw - 2}px;top:0;height:26px;background:${alpha(c,.1)};color:${c};font-weight:800;font-size:12px;display:grid;place-items:center">${y}년</div>`; i += n;
  }
  for (let i = 0; i < months; i++){
    const y = fy + Math.floor((fm - 1 + i) / 12), m = (fm - 1 + i) % 12 + 1, now = y === ty && m === tm;
    head += `<div style="position:absolute;left:${i * mw}px;width:${mw}px;top:26px;height:32px;display:grid;place-items:center;font-size:12px;font-weight:${now ? 800 : 600};color:${now ? "var(--blue)" : "var(--sub)"}">${m}월</div>`;
    grid += `<div style="position:absolute;left:${i * mw}px;top:0;bottom:0;width:1px;background:${m === 1 ? "var(--line)" : alpha("#8B95A1",.15)}"></div>`;
  }
  rows.forEach((r, i) => grid += `<div style="position:absolute;left:0;right:0;top:${(i + 1) * RH - 1}px;height:1px;background:var(--fill)"></div>`);
  grid += `<div style="position:absolute;left:${pos(t)}px;top:0;bottom:0;width:2px;background:${alpha("#F04452",.6)};z-index:2"></div>`;
  const bars = rows.map((r, i) => {

    return `<div class="gbar" data-i="${i}" style="left:${x}px;top:${i * RH + 14}px;width:${w}px;background:${ev ? alpha(r.color, r.done ? .45 : .88) : alpha(r.color, r.done ? .35 : .2)}">
      ${ev ? "" : `<div class="fillp" style="width:${pct(p)}%;background:${alpha(r.color, r.done ? .6 : .88)}"></div>`}
      <span class="lbl" style="color:${ev || p > .3 ? "#fff" : r.color}">${ev ? esc(r.title) : pct(p) + "%"}</span><span class="hdl"></span></div>`;
  }).join("");
  const names = rows.map(r => `<div class="grow-h" style="padding-left:${12 + r.depth * 14}px" data-open="${r.kind}:${r.ref.id}"><span style="width:3px;height:26px;border-radius:2px;background:${r.color};flex-shrink:0"></span><div style="min-width:0"><div style="font-weight:${r.depth ? 500 : 700};font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${r.done ? "color:var(--ter)" : ""}">${esc(r.title)}</div><div class="tiny ter">${r.label}</div></div></div>`).join("");
  $("#gantt").innerHTML = `<div class="gnames"><div class="ghead" style="display:flex;align-items:center;padding-left:14px;font-weight:700;color:var(--sub);font-size:13px">항목</div>${names || `<div class="grow-h ter small">비어 있어요</div>`}</div>
    <div class="gscroll" id="gscroll"><div style="width:${W}px"><div class="ghead">${head}</div><div style="position:relative;height:${H}px" id="gbody">${grid}${bars}${rows.length ? "" : `<div style="position:absolute;left:${pos(t) + 14}px;top:18px" class="small muted">‘+ 계획’으로 언제까지 끝낼 일을 추가하면 여기에 막대로 나와요</div>`}</div></div></div>`;
  const sc = $("#gscroll"); sc.scrollLeft = Math.max(0, pos(t) - mw * 1.5);

  // drag: move / resize, snapping to days
  const dayPx = mw / 30.44;
  $("#gbody").querySelectorAll(".gbar").forEach(el => {
    el.onmousedown = ev => {
      ev.preventDefault();

      let delta = 0, moved = false;
      const lbl = el.querySelector(".lbl"), baseLeft = parseFloat(el.style.left), baseW = parseFloat(el.style.width);
      const mm = e2 => {

        if (resize) delta = Math.max(delta, -(r.end - r.start));
        const s = resize ? r.start : r.start + delta, e = r.end + delta;
        el.style.left = (resize ? baseLeft : pos(s)) + "px"; el.style.width = Math.max(14, pos(e + 1) - pos(s)) + "px";
        el.style.outline = "2px solid " + r.color; lbl.textContent = span(s, e); lbl.style.color = "#fff";
      };

        if (delta){ if (r.kind === "g"){ if (!resize) r.ref.start += delta; r.ref.end += delta; } else { if (!resize) r.ref.day += delta; r.ref.endDay = (r.ref.endDay ?? r.ref.day) + delta; if (r.ref.endDay > r.ref.day) r.ref.minute = -1; } }
        commit();

      addEventListener("mousemove", mm); addEventListener("mouseup", mu);
    };
  });
}

let calMonth = (() => { const [y,m] = ymd(today()); return [y, m]; })(), calSel = today();
function vCalendar(){

    const lanes = [], segs = [];

function delSession(id){ if (!confirm("이 기록을 지울까요?")) return; D.sessions = D.sessions.filter(s => s.id !== id); commit(); }
function manualSession(){
  modal(`<h2>직접 기록</h2><div class="muted small">${full(planDay)}</div>
    <label class="f">과목</label><select id="mSub"><option value="">없음</option>${D.subjects.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select>
    <div class="grid g2"><div><label class="f">시작</label><input type="time" id="mS" value="09:00"></div><div><label class="f">끝</label><input type="time" id="mE" value="10:00"></div></div>
    <div class="acts"><button class="btn2" onclick="closeModal()">취소</button><button class="btn" id="mSave">기록하기</button></div>`);
  $("#mSave").onclick = () => {
    const toM = v => (+v.slice(0,2)) * 60 + (+v.slice(3,5)), s = toM($("#mS").value || "09:00"), e = toM($("#mE").value || "10:00");
    let du = (e - s + 1440) % 1440; if (!du) du = 1440;
    D.sessions.push({id:uid(), goalId:null, start:dayStartMs(planDay) + s * 60000, dur:du * 60000, sub:$("#mSub").value || null});
    closeModal(); commit();
  };
}
function editSubjects(){
  const st = {idx: D.subjects.length % 12, cc: null};
  modal(`<h2>과목 관리</h2>${D.subjects.map(s => `<div class="item"><span class="dot" style="background:${toHex(s.color)}"></span><b class="grow">${esc(s.name)}</b><button class="link" style="color:var(--red);background:transparent" onclick="delSubject('${s.id}')">삭제</button></div>`).join("") || '<div class="small muted">타이머와 플래너에서 고를 과목을 만들어요</div>'}
    <label class="f">새 과목</label><input id="sName" placeholder="예: 건축시공, 법규, 토익 LC">
    <label class="f">색상</label>${swatchRow("s", st.idx, null, false)}
    <div class="acts"><button class="btn2" onclick="closeModal()">닫기</button><button class="btn" id="sAdd">과목 추가</button></div>`);
  bindSwatches($("#modalRoot"), st);
  $("#sAdd").onclick = () => { const n = $("#sName").value.trim(); if (!n) return; D.subjects.push({id:uid(), name:n, color: st.cc ?? toInt(itemColors()[Math.max(0, st.idx)])}); save(); render(); editSubjects(); };
}
function delSubject(id){ D.subjects = D.subjects.filter(s => s.id !== id); if (D.timer.sub === id) D.timer.sub = null; save(); render(); editSubjects(); }

// ============================================================ QUOTES
function vQuotes(){
  const list = D.quotes.slice().sort((a,b) => b.createdAt - a.createdAt);
  return `<div class="row"><h1 class="grow">좋은 말 모음</h1><button class="btn" onclick="editQuote(null)">+ 적기</button></div>
  <div class="grid g2">${list.map(q => `<div class="card" style="cursor:pointer" onclick="editQuote('${q.id}')"><div style="font-size:19px;font-weight:700;line-height:1.55">“${esc(q.text)}”</div><div class="row small" style="margin-top:12px"><span class="muted grow">${q.who ? "— " + esc(q.who) : ""}</span><span class="ter">${full(q.day)}</span></div></div>`).join("") || '<div class="card"><div class="empty">누군가에게 들은 힘이 되는 말을 적어보세요</div></div>'}</div>`;
}
function editQuote(id){
  const q = id ? D.quotes.find(x => x.id === id) : null;
  modal(`<h2>${q ? "좋은 말 수정" : "좋은 말 적기"}</h2><label class="f">들은 말</label><textarea id="qText" placeholder="예: 너는 결국 해낼 사람이야">${esc(q ? q.text : "")}</textarea>
    <label class="f">누가 (선택)</label><input id="qWho" value="${esc(q ? q.who : "")}">
    <div class="acts">${q ? '<button class="btn2 danger" id="qDel">삭제</button>' : '<button class="btn2" onclick="closeModal()">취소</button>'}<button class="btn" id="qSave">저장하기</button></div>`);
  $("#qText").focus();
  $("#qSave").onclick = () => { const text = $("#qText").value.trim(); if (!text) return; const o = Object.assign(q || {id:uid(), day:today(), createdAt:Date.now()}, {text, who:$("#qWho").value.trim()}); if (!q) D.quotes.push(o); closeModal(); commit(); };
  if (q) $("#qDel").onclick = () => { D.quotes = D.quotes.filter(x => x.id !== q.id); closeModal(); commit(); };
}

// ============================================================ RESUME
let resumePlanned = true;
function resumePeriod(e){ const [sy,sm,sd] = ymd(e.day), [ey,em] = ymd(e.endDay ?? e.day), p = n => String(n).padStart(2,"0");
  return !((e.endDay ?? e.day) > e.day) ? `${sy}.${p(sm)}.${p(sd)}` : sy === ey && sm === em ? `${sy}.${p(sm)}` : `${sy}.${p(sm)} – ${ey}.${p(em)}`; }
function vResume(){
  const t = today(), order = [1,2,3,4,5,6];
  const secs = order.map(k => [k, D.events.filter(e => (e.type || 0) === k && (resumePlanned || e.day <= t)).sort((a,b) => b.day - a.day || b.endDay - a.endDay)]);
  return `<div class="row"><h1 class="grow">이력서</h1><button class="chip ${resumePlanned ? "on" : ""}" onclick="resumePlanned=!resumePlanned;render()">예정 포함</button><button class="chip" onclick="copyResume()">텍스트 복사</button></div>
  <div class="grid g2">${secs.map(([k, list]) => `<div class="card"><h3><span class="dot" style="background:${toHex(KINDS[k][2])}"></span>${KINDS[k][1]}<button class="link act" onclick="editEvent(null, null, true);setTimeout(()=>{$('#eKind').value=${k};$('#eKind').onchange()},0)">+ 추가</button></h3>
    ${list.map(e => `<div class="item" style="align-items:flex-start" onclick="editEvent('${e.id}')"><span class="small muted" style="width:130px;flex-shrink:0;font-variant-numeric:tabular-nums;padding-top:2px">${resumePeriod(e)}</span><div class="grow"><b>${esc(e.title)}</b> ${e.day > t ? '<span class="pill">예정</span>' : (e.endDay ?? e.day) >= t ? '<span class="pill" style="color:var(--green);background:var(--fill)">진행 중</span>' : ""}${e.memo ? `<div class="small muted">${esc(e.memo)}</div>` : ""}</div></div>`).join("") || '<div class="small ter">아직 없어요</div>'}</div>`).join("")}</div>`;
}
function copyResume(){
  const t = today();
  const txt = [1,2,3,4,5,6].map(k => { const l = D.events.filter(e => (e.type || 0) === k && (resumePlanned || e.day <= t)).sort((a,b) => b.day - a.day); return l.length ? `[${KINDS[k][1]}]\n` + l.map(e => `${resumePeriod(e)}  ${e.title}${e.day > t ? " (예정)" : ""}${e.memo ? " — " + e.memo : ""}`).join("\n") : ""; }).filter(Boolean).join("\n\n");
  navigator.clipboard.writeText(txt).then(() => toast("복사했어요"), () => toast("복사하지 못했어요"));
}

// ============================================================ SETTINGS (backup = same file as the phone app)
function vSettings(){
  const th = D.theme || {};
  return `<h1>설정</h1><div class="grid g2" style="align-items:start">
    <div class="card"><h3>폰 앱과 주고받기</h3>
      <p class="muted small" style="line-height:1.6">폰 UFK의 <b>설정 → 데이터 백업 → 백업 저장</b>으로 만든 파일을 여기서 열면 그대로 이어서 쓸 수 있어요. PC에서 고친 뒤 <b>백업 파일 내보내기</b>를 해서 폰에서 <b>불러오기</b>하면 폰에 반영돼요.</p>
      <div class="row" style="margin-top:14px"><button class="btn2 grow" onclick="$('#fileIn').click()">백업 파일 열기</button><button class="btn grow" onclick="exportBackup()">백업 파일 내보내기</button></div>
      <p class="tiny ter" style="margin-top:12px">한쪽에서만 고치고 옮기는 걸 추천해요. 파일을 열면 이 PC의 내용이 그 파일 내용으로 바뀌어요.</p></div>
    <div class="card"><h3>화면</h3>
      <div class="seg">${["시스템","라이트","다크"].map((l,i) => `<button class="${(th.mode || 0) === i ? "on" : ""}" onclick="D.theme.mode=${i};commit()">${l}</button>`).join("")}</div>
      <label class="f">포인트 색</label><div class="row"><input type="color" value="${accent()}" style="width:64px;height:44px;padding:4px" onchange="D.theme.accent=toInt(this.value);commit()"><button class="btn2" onclick="delete D.theme.accent;commit()">기본값</button></div>
      <p class="tiny ter" style="margin-top:10px">색 설정은 백업 파일에 같이 들어가서 폰과 같아져요.</p></div>
    <div class="card"><h3>요약</h3><div class="small muted" style="line-height:1.9">목표 ${D.goals.length}개 · 일정 ${D.events.length}개 · 공부 기록 ${D.sessions.length}개 · 과목 ${D.subjects.length}개 · 좋은 말 ${D.quotes.length}개 · 반복 ${D.routines.length}개</div>
      <button class="btn2 danger" style="margin-top:14px" onclick="if(confirm('이 PC의 UFK 데이터를 모두 지울까요?')){D=blank();commit()}">이 PC 데이터 지우기</button></div>
  </div>`;
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(D)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `UFK-backup-${iso(today())}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast("백업 파일을 저장했어요");
}
$("#fileIn").onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d.goals && !d.events) throw 0;
    if (!confirm(`목표 ${(d.goals || []).length}개 · 일정 ${(d.events || []).length}개를 불러올까요?\n이 PC의 지금 내용은 이 파일로 바뀌어요.`)) return;
    D = normalize(d); ensureRoutines(); commit(); toast("불러왔어요");
  } catch(e){ toast("UFK 백업 파일이 아니에요"); }
};

// ============================================================ modal + boot
function modal(html){ $("#modalRoot").innerHTML = `<div class="ov" onmousedown="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ $("#modalRoot").innerHTML = ""; }
addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v && v !== view && VIEWS.some(x => x[0] === v)){ view = v; render(); } });
addEventListener("storage", e => { if (e.key === KEY){ load(); render(); } }); // another tab changed data
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme());
setInterval(() => { const c = document.getElementById("tclock"); if (c && D.timer.running) c.textContent = clock(timerElapsed()); }, 500);

load(); ensureRoutines(); render();
</script>
</body>
</html>
